<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotate · Multi-Annotator Sentiment</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Multi-Annotator <span>Sentiment</span></div>
    <nav class="tabs-nav" aria-label="Pages">
      <a href="/" aria-current="page">Annotate</a>
      <a href="/stats.html">Stats &amp; Classifier</a>
    </nav>
  </header>

  <main class="narrow">
    <h1>Annotate</h1>
    <p class="lead">Each of the three annotators picks a label for the sentence. Saved annotations can't be edited.</p>

    <section class="panel" aria-labelledby="sentence-heading">
      <div class="sentence-label" id="sentence-heading">Current sentence</div>
      <p class="sentence" id="sentence" aria-live="polite">Loading…</p>
      <p class="sentence-meta" id="sentence-meta"></p>

      <div class="annotators" id="annotators"></div>

      <div class="actions">
        <button class="btn primary" id="save" type="button" disabled>Save annotation</button>
        <button class="btn" id="next" type="button">Generate sentence</button>
        <a class="btn" href="/stats.html">Show stats</a>
      </div>
      <p class="status" id="status" role="status"></p>
      <p class="session-count" id="session-count"></p>
    </section>
  </main>

  <script src="/annotate.js"></script>
</body>
</html>
